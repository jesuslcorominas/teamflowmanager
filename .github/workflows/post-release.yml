name: Post-Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  PACKAGE_NAME: com.jesuslcorominas.teamflowmanager

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Promote Play Alpha → Production  (solo en merges de release/*)
  # El despliegue es escalonado: la variable de repositorio PLAY_ROLLOUT_FRACTION
  # fija la fracción de usuarios que recibe la versión (0.1 por defecto). Ponla
  # a 1 para publicar al 100% de golpe. El resto del despliegue se escala a mano
  # desde Play Console.
  # ─────────────────────────────────────────────────────────────
  promote:
    name: Promote Play Alpha → Production
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -oP '\d+')
          VERSION_NAME=$(grep -E '^\s+versionName\s*=' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      # El token se firma con la clave de la service account (flujo JWT-bearer),
      # igual que hace el upload a alpha. No se usa google-github-actions/auth
      # con token_format porque eso impersona la cuenta vía IAM y exige el rol
      # iam.serviceAccountTokenCreator sobre sí misma, que la cuenta no tiene.
      - name: Get Play API access token
        id: auth
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/play-sa-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT

          CLIENT_EMAIL=$(jq -r '.client_email' <<< "$SA_JSON")
          jq -r '.private_key' <<< "$SA_JSON" > "$KEY_FILE"
          if [ -z "$CLIENT_EMAIL" ] || [ "$CLIENT_EMAIL" = "null" ]; then
            echo "❌ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON no contiene client_email"
            exit 1
          fi

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          CLAIMS=$(jq -nc \
            --arg iss "$CLIENT_EMAIL" \
            --argjson iat "$NOW" \
            --argjson exp "$((NOW + 3600))" \
            '{iss: $iss,
              scope: "https://www.googleapis.com/auth/androidpublisher",
              aud: "https://oauth2.googleapis.com/token",
              iat: $iat, exp: $exp}' | b64url)
          SIGNATURE=$(printf '%s.%s' "$HEADER" "$CLAIMS" \
            | openssl dgst -sha256 -sign "$KEY_FILE" -binary | b64url)

          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$HEADER.$CLAIMS.$SIGNATURE")
          TOKEN=$(jq -r '.access_token // empty' <<< "$RESPONSE")

          if [ -z "$TOKEN" ]; then
            echo "❌ La Play API no devolvió token de acceso"
            jq -r '.error_description // .error // "respuesta sin detalle"' <<< "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Token obtenido para $CLIENT_EMAIL"

      - name: Promote beta → production
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          PKG="${{ env.PACKAGE_NAME }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"

          if [ -f "distribution/whatsnew/whatsnew-es-ES" ]; then
            NOTES=$(cat distribution/whatsnew/whatsnew-es-ES)
          else
            NOTES="Corrección de errores y mejoras de rendimiento."
          fi

          EDIT_ID=$(curl -s -X POST \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG/edits" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' | jq -r '.id // empty')

          if [ -z "$EDIT_ID" ]; then
            echo "❌ Failed to create Play API edit"
            exit 1
          fi

          # Despliegue escalonado salvo que la fracción sea 1: con userFraction
          # la versión sale como inProgress y se escala desde Play Console.
          FRACTION="${{ vars.PLAY_ROLLOUT_FRACTION || '0.1' }}"
          if ! awk "BEGIN{exit !($FRACTION > 0 && $FRACTION <= 1)}"; then
            echo "❌ PLAY_ROLLOUT_FRACTION debe estar entre 0 (excluido) y 1 — valor recibido: $FRACTION"
            exit 1
          fi

          if awk "BEGIN{exit !($FRACTION == 1)}"; then
            RELEASE=$(jq -n --arg vc "$VERSION_CODE" --arg notes "$NOTES" \
              '{versionCodes: [$vc], status: "completed",
                releaseNotes: [{language: "es-ES", text: $notes}]}')
            echo "Publicando al 100% de los usuarios"
          else
            RELEASE=$(jq -n --arg vc "$VERSION_CODE" --arg notes "$NOTES" --argjson f "$FRACTION" \
              '{versionCodes: [$vc], status: "inProgress", userFraction: $f,
                releaseNotes: [{language: "es-ES", text: $notes}]}')
            echo "Despliegue escalonado a una fracción de $FRACTION de los usuarios"
          fi

          BODY=$(jq -n --argjson r "$RELEASE" '{track: "production", releases: [$r]}')

          TRACK_RESULT=$(curl -s -X PUT \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG/edits/$EDIT_ID/tracks/production" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "$TRACK_RESULT"
          if echo "$TRACK_RESULT" | jq -e '.error' > /dev/null; then
            echo "❌ La Play API rechazó la actualización del track de producción"
            exit 1
          fi

          RESULT=$(curl -s -X POST \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG/edits/$EDIT_ID:commit" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "$RESULT"
          if echo "$RESULT" | jq -e '.error' > /dev/null; then
            echo "❌ La Play API rechazó el commit de la edición — nada se ha publicado"
            exit 1
          fi
          echo "✅ versionCode $VERSION_CODE promovido a producción (fracción $FRACTION)"

  # ─────────────────────────────────────────────────────────────
  # 2. GitHub Release  (solo en merges de release/*)
  # Secuencial tras promote: si la promoción falla no se crea el Release, para
  # que no anuncie una publicación que no ha llegado a Play.
  # ─────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: promote
    if: |
      always() &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      (needs.promote.result == 'success' || needs.promote.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep -E '^\s+versionName\s*=' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Read release notes
        id: notes
        run: |
          if [ -f "distribution/whatsnew/whatsnew-es-ES" ]; then
            NOTES=$(cat distribution/whatsnew/whatsnew-es-ES)
          else
            NOTES="Corrección de errores y mejoras de rendimiento."
          fi
          echo "notes<<EOF_NOTES" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF_NOTES" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: TeamFlow Manager ${{ steps.version.outputs.version_name }}
          body: |
            ## TeamFlow Manager ${{ steps.version.outputs.version_name }}

            ${{ steps.notes.outputs.notes }}

            ---
            - Android: publicado en Google Play
            - iOS: IPA disponible en los artefactos del workflow de CI (30 días)
          draft: false
          prerelease: false

  # ─────────────────────────────────────────────────────────────
  # 3. Sync main → develop  (en cualquier merge a main)
  # Siempre crea PR (develop tiene branch protection + CI Gate).
  # Si no hay conflictos, activa auto-merge para que se fusione
  # automáticamente en cuanto pase el CI.
  # ─────────────────────────────────────────────────────────────
  sync-develop:
    name: Sync main → develop
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOTOMINAS_TOKEN }}

      - name: Create sync PR and enable auto-merge if no conflicts
        env:
          GH_TOKEN: ${{ secrets.BOTOMINAS_TOKEN }}
        run: |
          git config user.email "botominas@users.noreply.github.com"
          git config user.name "botominas"
          git fetch origin

          # Detectar si hay conflictos antes de crear la PR
          git checkout -b sync/main-to-develop origin/develop
          if git merge origin/main --no-edit --no-commit 2>/dev/null; then
            git merge --abort 2>/dev/null || true
            HAS_CONFLICTS=false
          else
            git merge --abort 2>/dev/null || true
            HAS_CONFLICTS=true
          fi

          # Crear PR si no existe ya
          EXISTING=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            if [ "$HAS_CONFLICTS" = "false" ]; then
              BODY="Sync automático tras merge a main. Sin conflictos — se fusionará automáticamente al pasar el CI."
            else
              BODY="Sync automático tras merge a main. ⚠️ Hay conflictos — requiere resolución manual antes de fusionar."
            fi
            PR_URL=$(gh pr create \
              --base develop \
              --head main \
              --title "chore: sync main → develop" \
              --body "$BODY")
            echo "✅ PR creada: $PR_URL"

            if [ "$HAS_CONFLICTS" = "false" ]; then
              PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$')
              gh pr merge "$PR_NUMBER" --auto --merge
              echo "✅ Auto-merge activado en PR #$PR_NUMBER"
            else
              echo "⚠️ Conflictos detectados — auto-merge NO activado"
            fi
          else
            echo "PR #$EXISTING ya existe"
          fi
