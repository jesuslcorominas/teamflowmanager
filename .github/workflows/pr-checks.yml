name: PR Checks

on:
  pull_request:
    branches: [develop]

# macOS runners are billed at 10x the Linux rate, so a new push must not leave the
# previous full build running.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Decide si hace falta el build completo de macOS.
  #
  # El job de macOS tarda unos 90 minutos y el ci-gate lo espera, así que una PR
  # que solo toca documentación o HTML pasaba de 6 minutos a hora y media. Solo
  # se ejecuta cuando la PR puede romper el build nativo: fuentes de iOS o de
  # shared-ui, ficheros de Gradle, el catálogo de versiones o este workflow.
  #
  # Los cinco fallos que destapó la PR #446 venían precisamente de ahí: versiones
  # en libs.versions.toml y dependencias en los build.gradle.kts.
  # ─────────────────────────────────────────────────────────────
  scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      needs_full_build: ${{ steps.detect.outputs.needs_full_build }}
      needs_ios_build: ${{ steps.detect.outputs.needs_ios_build }}
    steps:
      - name: List changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "$FILES"

          # Sin lista de ficheros no se puede decidir: se asume que sí hace falta.
          if [ -z "$FILES" ]; then
            echo "::warning::No se pudo listar los ficheros de la PR — se ejecuta el build completo por precaución."
            echo "needs_full_build=true" >> $GITHUB_OUTPUT
            echo "needs_ios_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # El job de iOS cubre todo lo que se compila para iOS: los módulos KMP enteros
          # (commonMain incluido, que el filtro del build completo no mira), iosApp, el
          # build de Gradle y este workflow. Solo se lo saltan las PRs de app/ (Android
          # puro), documentación, funciones de Firebase y similares.
          IOS_PATTERN='^(iosApp|shared-ui|domain|usecase|data|viewmodel|di)/|^gradle/|^gradle\.properties$|(^|/)build\.gradle\.kts$|^settings\.gradle\.kts$|^scripts/ci/|^\.github/workflows/pr-checks\.yml$'
          if echo "$FILES" | grep -qE "$IOS_PATTERN"; then
            echo "needs_ios_build=true" >> $GITHUB_OUTPUT
            echo "::notice::La PR toca código que se compila para iOS — se ejecuta el job de iOS."
          else
            echo "needs_ios_build=false" >> $GITHUB_OUTPUT
            echo "::notice::La PR no toca código de iOS — se omite el job de iOS."
          fi

          PATTERN='^iosApp/|^shared-ui/|^gradle/|^gradle\.properties$|(^|/)build\.gradle\.kts$|/iosMain/|^\.github/workflows/pr-checks\.yml$'
          if echo "$FILES" | grep -qE "$PATTERN"; then
            echo "needs_full_build=true" >> $GITHUB_OUTPUT
            echo "::notice::La PR toca el build nativo — se ejecuta el build completo en macOS."
          else
            echo "needs_full_build=false" >> $GITHUB_OUTPUT
            echo "::notice::La PR no toca el build nativo — se omite el build completo en macOS."
          fi

  lint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore google-services.json
        run: |
          mkdir -p app/src/dev app/src/prod
          echo "${{ secrets.GOOGLE_SERVICES_DEV }}"  | base64 --decode > app/src/dev/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_PROD }}" | base64 --decode > app/src/prod/google-services.json

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Check string placeholders
        run: python3 scripts/check-string-placeholders.py

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

  test-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore google-services.json
        run: |
          mkdir -p app/src/dev app/src/prod
          echo "${{ secrets.GOOGLE_SERVICES_DEV }}"  | base64 --decode > app/src/dev/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_PROD }}" | base64 --decode > app/src/prod/google-services.json

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run tests & coverage
        run: ./gradlew testDebugUnitTestCoverage --no-daemon --stacktrace

      - name: Post coverage comment on PR
        if: always()
        uses: Madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/testDebugUnitTestCoverage/coverage.xml
          token: ${{ secrets.BOTOMINAS_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 80
          title: '📊 Code Coverage'
          update-comment: true
          pass-emoji: '✅'
          fail-emoji: '❌'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/testDebugUnitTestCoverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Full `./gradlew build` on macOS.
  #
  # Everything else in CI runs on ubuntu-latest and only invokes `ktlintCheck` and
  # `testDebugUnitTestCoverage`, so nothing ever compiled the Kotlin/Native targets or
  # assembled the Android release variants. `./gradlew build` was broken on develop for
  # months behind five stacked failures that CI could not see (see PR #446). This job is
  # the guard against that happening again: it is the only place the whole build graph —
  # iOS metadata and native compilation included — is actually exercised.
  #
  # Su resultado NO tumba el ci-gate mientras se estabiliza: un job de 90 minutos no
  # debería bloquear una PR en sus primeras semanas de vida. Para promoverlo, basta con
  # comprobar su resultado en ci-gate cuando haya demostrado ser fiable.
  #
  # Solo se ejecuta cuando el job `scope` detecta que la PR toca el build nativo. Si se
  # omite, ci-gate lo ve como `skipped` y no pasa nada.
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: Full build (macOS)
    needs: scope
    if: needs.scope.outputs.needs_full_build == 'true'
    runs-on: macos-latest
    continue-on-error: true
    # A measured cold run (nothing in either cache) took just under 60 minutes on a
    # macos-latest runner: ~21 min of Gradle distribution download, configuration, Android
    # lint and unit tests before Kotlin/Native was even touched, then the native toolchain
    # download, the iOS compilation and R8. Warm runs are far shorter, but the budget has
    # to cover the cold case or the cache never gets written.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Restore and save are split on purpose. actions/cache's bundled post step does not
      # run when the job is cancelled — which is exactly what a timeout looks like — so the
      # combined action would never seed the cache after a slow cold run, leaving every
      # future run equally cold. The explicit save with `if: always()` writes whatever was
      # downloaded even if the build itself failed or timed out.
      #
      # ~/.konan holds the Kotlin/Native toolchain (~1 GB of LLVM, sysroots and platform
      # klibs); ~/.gradle holds the wrapper distribution and the dependency cache.
      - name: Restore Gradle and Kotlin/Native caches
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: macos-build-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
          restore-keys: |
            macos-build-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-
            macos-build-

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore google-services.json
        run: |
          mkdir -p app/src/dev app/src/prod
          echo "${{ secrets.GOOGLE_SERVICES_DEV }}"  | base64 --decode > app/src/dev/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_PROD }}" | base64 --decode > app/src/prod/google-services.json

      # :app:packageDevRelease and :app:packageProdRelease are part of `build` and sign the
      # APK, so the job needs the real keystore. These are the same secrets release.yml
      # already uses for :app:bundleProdRelease; reusing them keeps R8 minification and
      # resource shrinking — a classic source of release-only breakage — inside this check
      # instead of excluding the tasks with -x.
      - name: Restore release keystore
        run: echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > ${{ github.workspace }}/teamflow.jks

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run full build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/teamflow.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Save Gradle and Kotlin/Native caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-reports
          path: '**/build/reports/**'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # iOS: tests nativos de Kotlin y compilación de iosApp con xcodebuild.
  #
  # `Full build (macOS)` ejecuta `./gradlew build`, que compila los targets iOS de Kotlin
  # pero nunca el proyecto Xcode: ni CocoaPods, ni Swift, ni el enlazado del framework
  # `shared` con los pods. Este job sí lo hace, para el simulador y sin firmar, y corre
  # también cuando la PR solo toca commonMain (ver `needs_ios_build` en `scope`).
  #
  # Es bloqueante en ci-gate: una PR que rompe la compilación de iOS no se mergea.
  #
  # Tiempo: el peor caso es en frío (sin caché), con la descarga del toolchain de
  # Kotlin/Native y la compilación de los pods de Firestore en C++. El timeout de 75 min
  # lo acota.
  #
  # Firma y TestFlight (#501): añadir aquí los pasos de certificados/perfiles y un
  # `xcodebuild archive` para generic/platform=iOS después de "Build iosApp", y sustituir
  # los plists de placeholder por los reales desde secretos.
  # ─────────────────────────────────────────────────────────────
  ios-build:
    name: iOS build (simulator)
    needs: scope
    if: needs.scope.outputs.needs_ios_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Igual que en build-macos: restore y save separados para que la caché se escriba
      # aunque el job falle o se corte por timeout. Clave propia (`ios-build-`) para no
      # pisar la caché del build completo, que corre en paralelo.
      - name: Restore Gradle and Kotlin/Native caches
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ios-build-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
          restore-keys: |
            ios-build-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-
            ios-build-

      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('iosApp/Podfile.lock') }}

      # Los pods de Firestore se compilan desde fuente (gRPC, abseil, BoringSSL en C++) y
      # son la parte más lenta del build de Xcode. DerivedData guarda esos objetos; la ruta
      # es fija dentro del runner para que Xcode los reutilice de forma incremental.
      - name: Restore Xcode DerivedData
        id: dd-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ios-dd-${{ hashFiles('iosApp/Podfile.lock') }}-${{ github.run_id }}
          restore-keys: |
            ios-dd-${{ hashFiles('iosApp/Podfile.lock') }}-

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Gradle configura todos los proyectos, :app incluido, aunque aquí solo se compile iOS.
      - name: Restore google-services.json
        run: |
          mkdir -p app/src/dev app/src/prod
          echo "${{ secrets.GOOGLE_SERVICES_DEV }}"  | base64 --decode > app/src/dev/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_PROD }}" | base64 --decode > app/src/prod/google-services.json

      # El proyecto Xcode referencia los GoogleService-Info*.plist como recursos y están
      # gitignorados. Para compilar basta con que existan: ver el script.
      - name: Write placeholder GoogleService-Info plists
        run: scripts/ci/write-placeholder-google-service-plists.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run Kotlin/Native tests (iosSimulatorArm64)
        run: ./gradlew iosSimulatorArm64Test --no-daemon --stacktrace

      - name: Install CocoaPods dependencies
        working-directory: iosApp
        env:
          LANG: en_US.UTF-8
        run: pod install

      # La fase de build "Compile Kotlin Framework" del proyecto llama a
      # `./gradlew :iosApp:embedAndSignAppleFrameworkForXcode`, así que esto compila
      # también el framework `shared` y lo enlaza con los pods.
      #
      # ARCHS=arm64: con `generic/platform=iOS Simulator` Xcode compila también x86_64, lo
      # que duplica la compilación en C++ de Firestore/gRPC y no tiene sentido aquí: Kotlin
      # solo produce iosSimulatorArm64 y el runner es Apple Silicon.
      - name: Build iosApp (simulator, unsigned)
        run: |
          xcodebuild build \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Save Gradle and Kotlin/Native caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Xcode DerivedData
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ${{ steps.dd-cache.outputs.cache-primary-key }}

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

  ci-gate:
    name: CI Gate
    needs: [lint, test-and-coverage, build-macos, ios-build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check required jobs
        run: |
          lint="${{ needs.lint.result }}"
          tests="${{ needs.test-and-coverage.result }}"
          macos="${{ needs.build-macos.result }}"
          ios="${{ needs.ios-build.result }}"
          echo "lint: $lint"
          echo "test-and-coverage: $tests"
          echo "build-macos (non-blocking): $macos"
          echo "ios-build: $ios"
          if [[ "$ios" == "failure" || "$ios" == "cancelled" ]]; then
            echo "❌ iOS build (simulator) failed"
            exit 1
          elif [[ "$ios" == "skipped" ]]; then
            echo "⏩ iOS build (simulator) skipped — this PR does not touch code built for iOS."
          fi
          if [[ "$lint" == "failure" || "$lint" == "cancelled" ]]; then
            echo "❌ Lint job failed"
            exit 1
          fi
          if [[ "$tests" == "failure" || "$tests" == "cancelled" ]]; then
            echo "❌ Tests & Coverage job failed"
            exit 1
          fi
          if [[ "$macos" == "failure" ]]; then
            echo "⚠️ Full build (macOS) failed — not blocking yet, but ./gradlew build is broken."
          elif [[ "$macos" == "cancelled" ]]; then
            echo "⚠️ Full build (macOS) was cancelled — most likely it hit its timeout."
          elif [[ "$macos" == "skipped" ]]; then
            echo "⏩ Full build (macOS) skipped — this PR does not touch the native build."
          fi
          echo "✅ All required checks passed (or were skipped)"
